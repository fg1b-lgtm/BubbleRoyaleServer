<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Royale</title>
<!-- 탭 아이콘. 파일 없이 SVG 를 그대로 박아 넣는다 - 물풍선 아이템 아이콘과
     같은 모양이라 브라우저 탭에서부터 "이 게임 것" 이 티가 난다.
     파일이 없으면 브라우저가 기본 지구본을 그리는데, 그러면 탭을 열어놓은
     채로 여러 개 겹쳐놨을 때 이 게임 탭을 못 찾는다 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='17' r='13' fill='%234aa8e8'/%3E%3Ccircle cx='16' cy='17' r='13' fill='none' stroke='%230a1a34' stroke-width='2'/%3E%3Cellipse cx='12' cy='12' rx='4' ry='3' fill='%23ffffff' opacity='0.85'/%3E%3C/svg%3E">


<style>
  /* 판 위의 HUD 는 캔버스가 직접 그린다.
     여기 있는 것은 판 밖의 껍데기뿐이다.
     브라우저 기본 위젯을 그대로 쓰면 안을 아무리 잘 그려도
     "웹 페이지에 얹은 게임" 으로 보인다. */
  /* 9/4: 남색 계열을 걷어내고 판때기와 같은 나무색으로 바꿨다.
     판이 이제 상자·모래로 채워져 있는데 판 밖 껍데기만 남색 금속이면
     그 하나가 다른 게임에서 온 것처럼 붕 뜬다. web/game.js 의 PANEL 과
     같은 팔레트를 쓴다 — 색을 두 군데에 따로 적어두면 하나 바뀔 때 잊는다 */
  :root {
    --ink:   #ffeecf;
    --dim:   #c9986a;
    --wood-line: #2a160a;
    --wood-dark: #3d2110;
    --wood-mid:  #6b3c1c;
    --wood-lite: #a56a34;
    --wood-rim:  #c98c4d;
    --good:  #7ed957;
    --bad:   #ff6b5e;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* 화면을 판이 다 쓴다.
     설명은 위에 아주 작은 한 줄로 접어두고, 게임판이 세로를 전부 가져간다.
     캐릭터가 작게 느껴지던 게 여기서 절반은 풀린다 */
  body {
    margin: 0;
    color: var(--ink);
    font: 12px/1.4 "Pretendard", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    height: 100vh; overflow: hidden;
    /* 배경도 그라데이션을 뺐다. 판 밖이 부드럽게 번지면 판 안의 또렷함이 죽는다 */
    background: #140b06;
  }

  header {
    display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
    width: 100%; justify-content: center;
    height: 26px; padding: 0 10px;
    font-size: 11px; color: var(--dim);
    overflow: hidden; white-space: nowrap;
  }
  /* 창이 좁으면(노트북 화면 등) 띠 전체 너비가 넘쳐서 justify-content:center 가
     양쪽에서 똑같이 잘라낸다 - 로고("BUBBLE ROYALE")가 왼쪽부터 잘려나가는
     게 그래서였다. 첫 화면에서 로고 이름이 잘려 보이면 그걸로 완성도 평가가
     끝난다. 넘칠 때는 가운데 정렬을 버리고 왼쪽부터 채운다 - 로고는 절대
     안 잘리고, 자리가 모자라면 오른쪽 끝(다시 시작 버튼)부터 밀려난다.
     남는 자리가 더 모자라면 제일 안 중요한 것(키 안내 - 필드 위에 뜨는
     힌트와 중복이다)부터 숨긴다 */
  @media (max-width: 900px) {
    header { justify-content: flex-start; }
  }
  @media (max-width: 760px) {
    .keys { display: none; }
  }
  /* 위 띠도 판과 같은 재료로 만든다.
     둥근 알약 모양 칩과 그라데이션 글자는 웹 대시보드의 말투다.
     판이 픽셀 아트인데 그 위가 웹이면 두 개가 다른 게임처럼 보인다.
     모서리를 없애고, 그라데이션을 없애고, 테두리를 나무색 2px 로 굵게 세운다 */
  .mark {
    font-weight: 800; font-size: 11px; letter-spacing: .18em;
    color: var(--wood-rim);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: var(--wood-dark); border: 2px solid var(--wood-line);
    border-radius: 0; padding: 2px 8px; font-size: 11px; color: var(--dim);
  }
  .chip b { color: var(--ink); font-weight: 600; }
  .dot { width: 6px; height: 6px; border-radius: 0; background: var(--bad); }
  .on  { color: var(--good); }
  .off { color: var(--bad); }
  .dot.on  { background: var(--good); }
  .dot.off { background: var(--bad); }
  .keys { opacity: .6; }
  .keys kbd + kbd { margin-left: 1px; }

  #stage {
    position: relative; line-height: 0;
    flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
    min-height: 0; width: 100%;
  }
  canvas {
    display: block; border-radius: 0; background: #140b06;
    box-shadow: 0 18px 50px rgba(0,0,0,0.7), 0 0 0 2px var(--wood-line);
  }

  kbd {
    display: inline-block; min-width: 15px; text-align: center;
    background: var(--wood-mid); border: 2px solid var(--wood-line);
    border-radius: 0; padding: 0 4px; font: inherit; font-size: 10px; color: var(--ink);
  }
  button {
    background: var(--wood-mid); color: var(--ink);
    border: 2px solid var(--wood-line); border-radius: 0;
    padding: 2px 10px; font: inherit; font-size: 11px; cursor: pointer;
    transition: background-color 0.1s, transform 0.05s;
  }
  button:hover { background: var(--wood-lite); border-color: var(--wood-line); }
  /* 눌렀을 때 한 칸 내려앉는다. hover 만 있으면 클릭해도 "받았다"는 반응이
     없어서 두 번 누르게 된다 - 나무 판을 실제로 누른 것처럼 살짝 꺼지게 한다 */
  button:active { background: var(--wood-dark); transform: translateY(1px); }
</style>

<header>
  <span class="mark">BUBBLE ROYALE</span>
  <span class="chip"><span id="connDot" class="dot off"></span><span id="conn" class="off">연결 안 됨</span></span>
  <span class="chip"><b id="theme">—</b></span>
  <span class="keys"><kbd>WASD</kbd> 이동 <kbd>Space</kbd> 물풍선 <kbd>R</kbd> 다시 <kbd>M</kbd> 소리</span>
  <span class="chip"><span id="sound" class="on">소리 켜짐</span></span>
  <button id="restart">다시 시작</button>
</header>

<div id="stage"><canvas id="cv"></canvas></div>

<!-- 순서가 있다.
     audio · art · fx 는 서로를 모른다. net 이 상태를 들고,
     game 이 넷을 엮어서 한 프레임을 그린다 -->
<script src="audio.js"></script>
<script src="artdata.js"></script>
<script src="art.js"></script>
<script src="fx.js"></script>
<script src="predict.js"></script>
<script src="net.js"></script>
<script src="game.js"></script>
