<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Royale</title>

<style>
  /* 판 위의 HUD 는 캔버스가 직접 그린다.
     여기 있는 것은 판 밖의 껍데기뿐이다.
     브라우저 기본 위젯을 그대로 쓰면 안을 아무리 잘 그려도
     "웹 페이지에 얹은 게임" 으로 보인다. */
  :root {
    --ink:   #e6edf6;
    --dim:   #7d8794;
    --line:  rgba(255,255,255,0.09);
    --panel: rgba(14,19,27,0.72);
    --good:  #4ade80;
    --bad:   #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  /* 화면을 판이 다 쓴다.
     설명은 위에 아주 작은 한 줄로 접어두고, 게임판이 세로를 전부 가져간다.
     캐릭터가 작게 느껴지던 게 여기서 절반은 풀린다 */
  body {
    margin: 0;
    color: var(--ink);
    font: 12px/1.4 "Pretendard", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center;
    height: 100vh; overflow: hidden;
    /* 배경도 그라데이션을 뺐다. 판 밖이 부드럽게 번지면 판 안의 또렷함이 죽는다 */
    background: #0a0e14;
  }

  header {
    display: flex; align-items: center; gap: 8px; flex-wrap: nowrap;
    width: 100%; justify-content: center;
    height: 26px; padding: 0 10px;
    font-size: 11px; color: var(--dim);
    overflow: hidden; white-space: nowrap;
  }
  /* 위 띠도 판과 같은 재료로 만든다.
     둥근 알약 모양 칩과 그라데이션 글자는 웹 대시보드의 말투다.
     판이 픽셀 아트인데 그 위가 웹이면 두 개가 다른 게임처럼 보인다.
     모서리를 없애고, 그라데이션을 없애고, 테두리를 1px 로 세운다 */
  .mark {
    font-weight: 800; font-size: 11px; letter-spacing: .18em;
    color: #dbe6f2;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    background: #141a24; border: 1px solid #2b3546;
    border-radius: 0; padding: 2px 8px; font-size: 11px; color: var(--dim);
  }
  .chip b { color: var(--ink); font-weight: 600; }
  .dot { width: 6px; height: 6px; border-radius: 0; background: var(--bad); }
  .on  { color: var(--good); }
  .off { color: var(--bad); }
  .keys { opacity: .5; }
  .keys kbd + kbd { margin-left: 1px; }

  #stage {
    position: relative; line-height: 0;
    flex: 1 1 auto; display: flex; align-items: center; justify-content: center;
    min-height: 0; width: 100%;
  }
  canvas {
    display: block; border-radius: 6px; background: #06090d;
    box-shadow: 0 18px 50px rgba(0,0,0,0.7), 0 0 0 1px rgba(255,255,255,0.07);
  }

  kbd {
    display: inline-block; min-width: 15px; text-align: center;
    background: rgba(255,255,255,0.07); border: 1px solid var(--line);
    border-radius: 3px; padding: 0 4px; font: inherit; font-size: 10px; color: var(--ink);
  }
  button {
    background: rgba(255,255,255,0.07); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 2px 10px; font: inherit; font-size: 11px; cursor: pointer;
  }
  button:hover { background: rgba(255,255,255,0.13); border-color: rgba(255,255,255,0.2); }
</style>

<header>
  <span class="mark">BUBBLE ROYALE</span>
  <span class="chip"><span class="dot"></span><span id="conn" class="off">연결 안 됨</span></span>
  <span class="chip"><b id="theme">—</b></span>
  <span class="keys"><kbd>WASD</kbd> 이동 <kbd>Space</kbd> 물풍선 <kbd>R</kbd> 다시 <kbd>M</kbd> 소리</span>
  <span class="chip"><span id="sound" class="on">소리 켜짐</span></span>
  <button id="restart">다시 시작</button>
</header>

<div id="stage"><canvas id="cv"></canvas></div>

<!-- 순서가 있다.
     audio · art · fx 는 서로를 모른다. net 이 상태를 들고,
     game 이 넷을 엮어서 한 프레임을 그린다 -->
<script src="audio.js"></script>
<script src="art.js"></script>
<script src="fx.js"></script>
<script src="predict.js"></script>
<script src="net.js"></script>
<script src="game.js"></script>
