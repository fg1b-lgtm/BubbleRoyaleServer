<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bubble Royale</title>

<style>
  /* 판 위의 HUD 는 캔버스가 직접 그린다.
     여기 있는 것은 판 밖의 껍데기뿐이다.
     브라우저 기본 위젯을 그대로 쓰면 안을 아무리 잘 그려도
     "웹 페이지에 얹은 게임" 으로 보인다. */
  :root {
    --ink:   #e6edf6;
    --dim:   #7d8794;
    --line:  rgba(255,255,255,0.09);
    --panel: rgba(14,19,27,0.72);
    --good:  #4ade80;
    --bad:   #f87171;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    color: var(--ink);
    font: 13px/1.5 "Pretendard", "Segoe UI", system-ui, sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 12px; padding: 14px;
    background:
      radial-gradient(1200px 700px at 50% -10%, #16202e 0%, #0a0e14 55%, #06090d 100%);
  }

  header {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    width: 100%; justify-content: center;
  }
  .mark {
    font-weight: 800; font-size: 15px; letter-spacing: .18em;
    background: linear-gradient(180deg, #ffffff, #8fc7de);
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .chip {
    display: inline-flex; align-items: center; gap: 7px;
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 999px; padding: 5px 12px; font-size: 12px; color: var(--dim);
  }
  .chip b { color: var(--ink); font-weight: 600; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--bad); }
  .on  { color: var(--good); }
  .off { color: var(--bad); }

  /* 판을 액자에 넣는다. 테두리와 바깥 그림자가 있으면 화면이 창문처럼 보인다 */
  #stage {
    position: relative; line-height: 0;
    border-radius: 10px; padding: 6px;
    background: linear-gradient(180deg, rgba(255,255,255,0.07), rgba(255,255,255,0.02));
    box-shadow: 0 24px 60px rgba(0,0,0,0.65), 0 0 0 1px rgba(255,255,255,0.05) inset;
  }
  canvas { display: block; border-radius: 6px; background: #06090d; }

  footer {
    display: flex; gap: 10px; align-items: center; flex-wrap: wrap; justify-content: center;
    color: var(--dim); font-size: 12px;
  }
  kbd {
    display: inline-block; min-width: 20px; text-align: center;
    background: rgba(255,255,255,0.07); border: 1px solid var(--line);
    border-bottom-width: 2px; border-radius: 4px;
    padding: 2px 6px; font: inherit; font-size: 11px; color: var(--ink);
  }
  button {
    background: rgba(255,255,255,0.07); color: var(--ink);
    border: 1px solid var(--line); border-radius: 999px;
    padding: 5px 14px; font: inherit; font-size: 12px; cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  button:hover { background: rgba(255,255,255,0.13); border-color: rgba(255,255,255,0.2); }
</style>

<header>
  <span class="mark">BUBBLE ROYALE</span>
  <span class="chip"><span class="dot"></span><span id="conn" class="off">연결 안 됨</span></span>
  <span class="chip">판 모양 <b id="theme">—</b></span>
  <span class="chip"><span id="sound" class="on">소리 켜짐</span></span>
  <button id="restart">다시 시작</button>
</header>

<div id="stage"><canvas id="cv"></canvas></div>

<footer>
  <span><kbd>←</kbd><kbd>↑</kbd><kbd>→</kbd><kbd>↓</kbd> 또는 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 이동</span>
  <span><kbd>Space</kbd> 물풍선</span>
  <span><kbd>R</kbd> 다시 시작</span>
  <span><kbd>M</kbd> 소리</span>
  <span style="opacity:.55">그림도 소리도 파일 없이 그때그때 만든다</span>
</footer>

<!-- 순서가 있다.
     audio · art · fx 는 서로를 모른다. net 이 상태를 들고,
     game 이 넷을 엮어서 한 프레임을 그린다 -->
<script src="audio.js"></script>
<script src="art.js"></script>
<script src="fx.js"></script>
<script src="net.js"></script>
<script src="game.js"></script>
